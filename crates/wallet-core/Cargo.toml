[package]
name = "wallet-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_decimal = { version = "1.36", features = ["serde-str"] }
ulid = { version = "3.0", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"

[dev-dependencies]
rust_decimal_macros = "1.36"
pretty_assertions = "1.4"
