name: Sync Secrets from pds-android

on:
  workflow_dispatch:

jobs:
  sync:
    name: Copy Keystore and Publishing Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Sync Secrets to wallet repository
        env:
          SOURCE_PAT: ${{ secrets.GH_SYNC_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FDROID_REPO_TOKEN: ${{ secrets.FDROID_REPO_TOKEN }}
        run: |
          export GH_TOKEN="$SOURCE_PAT"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo -n "$KEYSTORE_BASE64" | gh secret set KEYSTORE_BASE64 -R Tau2C/wallet
          fi
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            echo -n "$KEYSTORE_PASSWORD" | gh secret set KEYSTORE_PASSWORD -R Tau2C/wallet
          fi
          if [ -n "$KEY_ALIAS" ]; then
            echo -n "$KEY_ALIAS" | gh secret set KEY_ALIAS -R Tau2C/wallet
          fi
          if [ -n "$KEY_PASSWORD" ]; then
            echo -n "$KEY_PASSWORD" | gh secret set KEY_PASSWORD -R Tau2C/wallet
          fi
          if [ -n "$FDROID_REPO_TOKEN" ]; then
            echo -n "$FDROID_REPO_TOKEN" | gh secret set FDROID_REPO_TOKEN -R Tau2C/wallet
          fi
          echo "Secrets copied to Tau2C/wallet successfully."
