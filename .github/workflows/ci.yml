name: CI Checks & Tests

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  rust-checks:
    name: Rust Lint, Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-checks-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-checks-${{ runner.os }}-

      - name: Check code formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Run Clippy linter
        run: cargo clippy --all-targets --all-features -- -D warnings -A unexpected_cfgs

      - name: Run Rust unit and integration tests
        run: cargo test --all-targets --all-features

  flutter-checks:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Analyze & Test Flutter
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter pub get
            flutter analyze
            flutter test
          else
            echo "Katalog Fluttera nie został jeszcze dodany. Krok pominięty."
          fi

      - name: Build & Verify Debug APK
        run: |
          flutter build apk --debug
          APK_FILE=$(find build/app/outputs/flutter-apk -name "*debug*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found debug APK: $APK_FILE"
            sha256sum "$APK_FILE"

            APKSIGNER_BIN=$(ls -d ${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
            if [ ! -f "$APKSIGNER_BIN" ]; then
              APKSIGNER_BIN=$(which apksigner 2>/dev/null || true)
            fi

            if [ -n "$APKSIGNER_BIN" ]; then
              echo "Verifying debug APK signature with $APKSIGNER_BIN"
              "$APKSIGNER_BIN" verify --verbose "$APK_FILE"
            fi
          fi
