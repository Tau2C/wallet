name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build & Publish to F-Droid Repo
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-ndk-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-ndk-${{ runner.os }}-

      - name: Install cargo-ndk
        run: which cargo-ndk || cargo install cargo-ndk

      - name: Build Rust Native Android Libraries (.so)
        run: |
          mkdir -p android/app/src/main/jniLibs
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o android/app/src/main/jniLibs build --release -p wallet-core
          ls -la android/app/src/main/jniLibs/

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/release.keystore" >> $GITHUB_ENV
          fi

      - name: Build Android Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          RAW_VERSION="${GITHUB_REF_NAME#v}"
          CLEAN_VERSION=$(echo "$RAW_VERSION" | sed -E 's/-.*//')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-1}
          PATCH=${PATCH:-0}
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          VERSION_NAME="${RAW_VERSION}"
          echo "Building APK with versionName=${VERSION_NAME}, versionCode=${VERSION_CODE}"
          flutter pub get
          flutter build apk --release --build-name="${VERSION_NAME}" --build-number="${VERSION_CODE}"

      - name: Collect build artifacts
        run: |
          mkdir -p release-artifacts
          TAG_NAME="${GITHUB_REF_NAME:-0.1.0}"
          APK_FILE=$(find build/app/outputs/flutter-apk -name "*release*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "release-artifacts/wallet-${TAG_NAME}.apk"
          else
            find build/app/outputs/flutter-apk -name "*.apk" -exec cp {} release-artifacts/ \;
          fi
          ls -la release-artifacts/

      - name: Verify APK Signature & Manifest Metadata
        run: |
          APK_FILE=$(find release-artifacts -name "*.apk" | head -n 1)
          echo "Validating APK: $APK_FILE"

          # Locate apksigner and apkanalyzer
          APKSIGNER_BIN=$(ls -d ${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          APKANALYZER_BIN="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/apkanalyzer"

          if [ ! -f "$APKSIGNER_BIN" ]; then
            APKSIGNER_BIN=$(which apksigner 2>/dev/null || true)
          fi
          if [ ! -f "$APKANALYZER_BIN" ]; then
            APKANALYZER_BIN=$(which apkanalyzer 2>/dev/null || true)
          fi

          echo "Using apksigner: $APKSIGNER_BIN"
          echo "Using apkanalyzer: $APKANALYZER_BIN"

          # 1. Run apksigner verify with verbose and cert printing
          SIG_OUTPUT=$("$APKSIGNER_BIN" verify --verbose --print-certs "$APK_FILE")
          echo "$SIG_OUTPUT"

          # Check v1, v2, v3 schemes
          echo "$SIG_OUTPUT" | grep -E "Verified using v1 scheme \(JAR signing\): true" || { echo "ERROR: APK is not signed with v1 scheme"; exit 1; }
          echo "$SIG_OUTPUT" | grep -E "Verified using v2 scheme \(APK Signature Scheme v2\): true" || { echo "ERROR: APK is not signed with v2 scheme"; exit 1; }
          echo "$SIG_OUTPUT" | grep -E "Verified using v3 scheme \(APK Signature Scheme v3\): true" || { echo "ERROR: APK is not signed with v3 scheme"; exit 1; }

          # Verify certificate SHA-256 fingerprint against expected
          EXPECTED_FINGERPRINT=$(tr -d ' \r\n' < .github/expected-cert-sha256.txt | tr '[:lower:]' '[:upper:]')
          ACTUAL_FINGERPRINT=$(echo "$SIG_OUTPUT" | grep -i "Signer #1 certificate SHA-256 digest:" | awk '{print $NF}' | tr '[:lower:]' '[:upper:]')
          # Normalize format (without colons for comparison)
          EXPECTED_CLEAN=$(echo "$EXPECTED_FINGERPRINT" | tr -d ':')
          ACTUAL_CLEAN=$(echo "$ACTUAL_FINGERPRINT" | tr -d ':')

          echo "Expected Fingerprint: $EXPECTED_CLEAN"
          echo "Actual Fingerprint:   $ACTUAL_CLEAN"

          if [ "$EXPECTED_CLEAN" != "$ACTUAL_CLEAN" ]; then
            echo "ERROR: Certificate fingerprint mismatch!"
            exit 1
          fi
          echo "Certificate fingerprint verified successfully."

          # 2. Verify Manifest Metadata with apkanalyzer if available
          if [ -f "$APKANALYZER_BIN" ]; then
            MIN_SDK=$("$APKANALYZER_BIN" manifest min-sdk "$APK_FILE" || true)
            TARGET_SDK=$("$APKANALYZER_BIN" manifest target-sdk "$APK_FILE" || true)
            APP_ID=$("$APKANALYZER_BIN" manifest application-id "$APK_FILE" || true)
            echo "Manifest appId: $APP_ID, minSdk: $MIN_SDK, targetSdk: $TARGET_SDK"

            if [ "$APP_ID" != "top.tau2c.wallet" ]; then
              echo "ERROR: Unexpected application ID: $APP_ID"; exit 1;
            fi
            if [ -n "$MIN_SDK" ] && [ "$MIN_SDK" -lt 21 ]; then
              echo "ERROR: minSdk ($MIN_SDK) is too low (expected >= 21)"; exit 1;
            fi
          fi

      - name: Generate SHA256SUMS
        run: |
          cd release-artifacts
          sha256sum *.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-dev') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true

      - name: Trigger F-Droid Repo Update
        if: ${{ env.FDROID_REPO_TOKEN != '' && !contains(github.ref_name, '-dev') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-rc') }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.FDROID_REPO_TOKEN }}
          repository: Tau2C/fdroid-repo
          event-type: new-release
